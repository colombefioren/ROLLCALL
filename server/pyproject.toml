[project]
name = "rollcall-server"
version = "0.1.0"
description = "Rollcall vision service: camera attendance, alerts and event log"
requires-python = ">=3.12"
dependencies = [
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "fastapi[standard]>=0.115",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "websockets>=12",
]

[tool.uv]
package = false
exclude-newer = "7 days"
